<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="scripts/generator.js"></script>
</head>
<body>
<script>
window.addEventListener('message', (event) => {
  const code = event.data && event.data.code;
  if (typeof code !== 'string') return;

  console.log('[sandbox] received code to execute:', code);

  try {
    const fn = new Function(code + '\nreturn typeof result !== "undefined" ? result : undefined;');
    const result = fn();
    console.log('[sandbox] raw result:', result);

    const lines = [];
    for (let i = 0; i < result.length; i++) {
      const testCase = result[i];
      for (let j = 0; j < testCase.length; j++) {
        lines.push(convertToString(testCase[j]));
      }
    }

    const output = lines.join('\n');
    console.log('[sandbox] serialized output:', output);
    event.source.postMessage({ success: true, data: output }, event.origin);
  } catch (err) {
    console.error('[sandbox] execution error:', err);
    event.source.postMessage({ success: false, error: err.message }, event.origin);
  }
});
</script>
</body>
</html>
